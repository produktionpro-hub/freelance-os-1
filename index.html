<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freelance OS - Bientôt disponible</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #07111f;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 600px;
      padding: 20px;
    }
    h1 {
      font-size: 42px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 18px;
      color: #94a3b8;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      margin-top: 30px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      font-size: 14px;
      color: #8ce7ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Freelance OS</h1>
    <p>Le système d'exploitation ultime pour les freelances arrive très bientôt.</p>
    <p>Préparez-vous à automatiser votre prospection et à gagner du temps.</p>
    <div class="badge">🚧 Site en construction 🚧</div>
  </div>
</body>
</html>
